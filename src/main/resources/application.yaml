spring:
  application:
    name: edi_carrier_integration_service
  cloud:
    vault:
      host: ${VAULT_HOST:localhost}
      port: ${VAULT_PORT:8200}
      scheme: ${VAULT_SCHEME:http}
      authentication: ${VAULT_AUTH_METHOD:TOKEN}
      token: ${VAULT_TOKEN:root}
      kv:
        enabled: true
        backend: secret
        default-context: edi-carrier-service
  main:
    banner-mode: off

server:
  port: ${SERVER_PORT:8080}

edi:
  pipeline:
    max-payload-bytes: ${EDI_MAX_PAYLOAD_BYTES:20971520}
  archive:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:edi-archive}
  security:
    keystore:
      path: ${KEYSTORE_PATH:${vault.secret.keystore-path:/etc/secrets/keystore.p12}}
      password: ${KEYSTORE_PASSWORD:${vault.secret.keystore-password:keystorepassword}}
      type: ${KEYSTORE_TYPE:PKCS12}
    truststore:
      path: ${TRUSTSTORE_PATH:${vault.secret.truststore-path:/etc/secrets/truststore.p12}}
      password: ${TRUSTSTORE_PASSWORD:${vault.secret.truststore-password:truststorepassword}}
      type: ${TRUSTSTORE_TYPE:PKCS12}

camel:
  main:
    name: CamelAS2Server
  springboot:
    main-run-controller: true

as2:
  server:
    id: AS2-SERVER-001
    host: localhost
    port: 9090
    path: /as2/inbound
    partner-id: TRADING-PARTNER-001

logging:
  level:
    com.innowise.edi_carrier_integration_service: ${LOGGING_LEVEL_APP:INFO}
    org.smooks: ${LOGGING_LEVEL_SMOOKS:WARN}
    org.bouncycastle: ${LOGGING_LEVEL_BC:WARN}
    org.apache.camel: INFO
    com.example.as2: DEBUG