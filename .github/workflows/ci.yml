name: CI pipeline

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  run-shared-ci:
    uses: MrKravz/shared-ci-workflows/.github/workflows/ci.yaml@662608a08572a0de1aaf581a043da711a3e362d2
    with:
      build-tool: 'maven'
      sonar-args: >
        -Dsonar.projectKey=GutnikElina_edi-carrier-integration-service
        -Dsonar.organization=gutnikelina
        -Dsonar.host.url=https://sonarcloud.io
        -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        '-Dsonar.exclusions=**/com/innowise/edi_carrier_integration_service/config/**/*,**/infrastructure/config/**/*,**/application/**/*,**/domain/**/*,**/processor/**/*,**/routes/**/*,**/*Application.java'
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}